services:
  # Backend service
  backend:
    build:
      context: .
      dockerfile: docker/dev/backend.Dockerfile
    ports:
      - "${BACKEND_PORT}:8000"  # FIXED: Internal port locked to 8000
    environment:
      - TIMESCALEDB_HOST=timescaledb
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092 # FIXED: Internal Kafka port
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mlflow:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.connect((\"localhost\", 8000)); s.close()' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./backend:/app/backend

  # Frontend service
  frontend:
    build:
      context: .
      dockerfile: docker/dev/frontend.Dockerfile
    ports:
      - "${FRONTEND_PORT}:3000" # FIXED: Internal port locked to 3000
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_BASE_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started

  # TimescaleDB service
  timescaledb:
    build:
      context: .
      dockerfile: docker/dev/timescaledb.Dockerfile
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432" # FIXED: Internal port locked to 5432
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka service
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      # FIXED: Split Internal (29092) and External (9092) listeners
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT}
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server=localhost:29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    ports:
      - "${KAFKA_PORT}:9092"

  # Zookeeper service
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
      - ZOOKEEPER_4LW_COMMANDS_WHITELIST=srvr,mntr,ruok
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${ZOOKEEPER_CLIENT_PORT}:2181"

  # MLflow service
  mlflow:
    build:
      context: .
      dockerfile: docker/dev/mlflow.Dockerfile
    environment:
      - MLFLOW_PORT=5000
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.connect((\"localhost\", 5000)); s.close()' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    ports:
      - "${MLFLOW_PORT}:5000"

  # Kafka Consumer service
  consumer:
    build:
      context: .
      dockerfile: docker/dev/consumer.Dockerfile
    environment:
      - TIMESCALEDB_HOST=timescaledb
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend

  # DB Initialization service
  db-init:
    build:
      context: .
      dockerfile: docker/dev/db-init.Dockerfile
    environment:
      - TIMESCALEDB_HOST=timescaledb
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_started
    profiles:
      - init
    volumes:
      - ./backend:/app/backend

  # Inference service
  inference:
    build:
      context: .
      dockerfile: docker/dev/inference.Dockerfile
    environment:
      - TIMESCALEDB_HOST=timescaledb
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      timescaledb:
        condition: service_healthy
      mlflow:
        condition: service_started
    profiles:
      - task
    volumes:
      - ./backend:/app/backend

  # Training service
  training:
    build:
      context: .
      dockerfile: docker/dev/training.Dockerfile
    environment:
      - TIMESCALEDB_HOST=timescaledb
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      timescaledb:
        condition: service_healthy
      mlflow:
        condition: service_started
    profiles:
      - task
    volumes:
      - ./backend:/app/backend

  # Adminer — lightweight DB GUI for schema inspection
  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  timescaledb-data:
