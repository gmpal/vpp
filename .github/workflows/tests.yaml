name: Backend CI

# Runs only when backend-relevant files change; frontend-only changes skip it.
on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "tests/**"
      - "requirements/**"
      - "pytest.ini"
      - "pyproject.toml"
      - "docker/**"
      - "entrypoints/**"
      - "docker-compose*.yaml"
      - ".github/workflows/tests.yaml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "tests/**"
      - "requirements/**"
      - "pytest.ini"
      - "pyproject.toml"
      - "docker/**"
      - "entrypoints/**"
      - "docker-compose*.yaml"
      - ".github/workflows/tests.yaml"

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v1
        with:
          args: "check ."

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dev images
        run: docker compose build backend consumer

      - name: Build prod images
        run: docker compose -f docker-compose.prod.yaml build backend consumer
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          DOMAIN: localhost

  unit:
    name: Unit tests (no infrastructure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/requirements-*.txt

      - name: Install dependencies
        run: pip install -r requirements/requirements-test.txt

      - name: Run unit tests
        run: pytest -m "not integration"

  integration:
    name: Full suite (TimescaleDB)
    runs-on: ubuntu-latest
    needs: unit

    services:
      timescale:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      VPP_TEST_DB_HOST: localhost
      VPP_TEST_DB_PORT: "55432"
      VPP_TEST_DB_PASSWORD: testpass
      GIST_SECRET: ${{ secrets.GIST_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/requirements-*.txt

      - name: Install dependencies
        run: pip install -r requirements/requirements-test.txt

      - name: Run all tests with coverage
        run: pytest --cov=backend --cov-report=xml --cov-report=term-missing

      - name: Extract coverage percentage
        if: github.ref == 'refs/heads/main'
        run: |
          python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); coverage = float(root.get('line-rate')) * 100; print(f'COVERAGE_PCT={int(coverage)}')" >> $GITHUB_ENV

      - name: Create coverage badge manually
        if: github.ref == 'refs/heads/main' && env.GIST_SECRET != ''
        run: |
          curl -X PATCH -H "Authorization: token $GIST_SECRET" -d "{\"files\": {\"coverage.json\": {\"content\": \"{\\\"schemaVersion\\\": 1, \\\"label\\\": \\\"Coverage\\\", \\\"message\\\": \\\"${{ env.COVERAGE_PCT }}%\\\", \\\"color\\\": \\\"green\\\"}\"}}}" https://api.github.com/gists/ecfd0b8a247e4da2abafbdc142d7d01b
