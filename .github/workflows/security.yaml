name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 8 * * 1"  # Every Monday at 08:00 UTC

jobs:
  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend dependencies
        run: pip-audit -r requirements/requirements-backend.txt

      - name: Audit forecasting dependencies
        run: pip-audit -r requirements/requirements-forecasting.txt

      - name: Audit consumer dependencies
        run: pip-audit -r requirements/requirements-consumer.txt

  python-sast:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        run: bandit -r backend/ -ll --exclude backend/tests

  npm-audit:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Audit npm packages
        # --audit-level=high: only fail on high/critical, ignore moderate
        run: npm audit --audit-level=high

  docker-scan:
    name: Docker Image Scan (Trivy)
    runs-on: ubuntu-latest
    # Only run on push to main to avoid blocking PRs on image scan time
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image for scanning
        run: docker build -f docker/dev/backend.Dockerfile -t vpp-backend:scan .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vpp-backend:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
